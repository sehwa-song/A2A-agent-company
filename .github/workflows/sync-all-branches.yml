
name: 팀 저장소 전체 브랜치 자동 동기화

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 개인 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 원본 브랜치 동기화
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/jooho-le/A2A-agent-company.git

          git fetch --prune upstream '+refs/heads/*:refs/remotes/upstream/*'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          failed=0

          while IFS= read -r branch; do
            echo "동기화 대상: $branch"

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              if ! git push origin "refs/remotes/upstream/$branch:refs/heads/$branch"; then
                failed=1
              fi
              continue
            fi

            if git merge-base --is-ancestor "refs/remotes/upstream/$branch" "refs/remotes/origin/$branch"; then
              echo "이미 최신 상태: $branch"
              continue
            fi

            git switch -C sync-work "refs/remotes/origin/$branch"

            if git merge --no-edit "refs/remotes/upstream/$branch"; then
              if ! git push origin "HEAD:refs/heads/$branch"; then
                failed=1
              fi
            else
              git merge --abort || true
              failed=1
              echo "::warning::병합 충돌: $branch (기존 작업 보존)"
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream)

          exit "$failed"
